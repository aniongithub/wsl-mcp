name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build ${{ matrix.artifact }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: wsl-mcp-windows-x64
          - target: aarch64-pc-windows-msvc
            artifact: wsl-mcp-windows-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p wsl-mcp

      - name: Package binary
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/wsl-mcp.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}.zip

  upload-install-script:
    name: Upload install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Upload install.ps1
        uses: softprops/action-gh-release@v3
        with:
          files: install.ps1
